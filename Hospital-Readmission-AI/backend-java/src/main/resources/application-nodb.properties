# Optional profile: start the backend WITHOUT SQL Server (health check only).
# Run:
#   mvn spring-boot:run -Dspring-boot.run.profiles=nodb
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
# Self-contained so it also works before application.properties is created
server.port=${BACKEND_PORT:8080}
server.servlet.context-path=/api
app.ml-service.url=${ML_SERVICE_URL:http://localhost:8000}
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
